name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    name: Create Release Manifest
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Create latest.json for updater
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

          RELEASE_URL="https://debugger-app.sfo3.cdn.digitaloceanspaces.com/releases/v${VERSION}"

          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "Release ${VERSION}",
            "pub_date": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "platforms": {
              "darwin-aarch64": {
                "signature": "",
                "url": "${RELEASE_URL}/Akira%20Debugger_${VERSION}_universal.dmg"
              },
              "darwin-x86_64": {
                "signature": "",
                "url": "${RELEASE_URL}/Akira%20Debugger_${VERSION}_universal.dmg"
              },
              "linux-x86_64": {
                "signature": "",
                "url": "${RELEASE_URL}/akira-debugger_${VERSION}_amd64.AppImage.tar.gz"
              },
              "windows-x86_64": {
                "signature": "",
                "url": "${RELEASE_URL}/Akira.Debugger_${VERSION}_x64_en-US.msi.zip"
              }
            }
          }
          EOF
          cat latest.json

      - name: Upload latest.json to Digital Ocean Spaces
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET }}
        run: |
          if [ -z "${{ env.VERSION }}" ]; then
            echo "ERROR: VERSION not set"
            exit 1
          fi

          echo "Uploading latest.json for version ${{ env.VERSION }}"
          aws s3 cp latest.json "s3://debugger-app/releases/latest.json" \
            --endpoint-url https://sfo3.digitaloceanspaces.com \
            --region us-east-1 \
            --acl public-read \
            --content-type application/json

          echo "Upload completed"

  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }},aarch64-apple-darwin

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Node dependencies
        run: npm ci

      - name: Build application
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: npm run tauri build

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/release/bundle/dmg/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS to Digital Ocean Spaces
        if: runner.os == 'macOS'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          for file in src-tauri/target/release/bundle/dmg/*.dmg; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              aws s3 cp "$file" "s3://debugger-app/releases/v${VERSION}/${filename}" \
                --endpoint-url https://sfo3.digitaloceanspaces.com \
                --region us-east-1 \
                --acl public-read
            fi
          done

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/release/bundle/appimage/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux to Digital Ocean Spaces
        if: runner.os == 'Linux'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          for file in src-tauri/target/release/bundle/appimage/*.AppImage*; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              aws s3 cp "$file" "s3://debugger-app/releases/v${VERSION}/${filename}" \
                --endpoint-url https://sfo3.digitaloceanspaces.com \
                --region us-east-1 \
                --acl public-read
            fi
          done

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/target/release/bundle/msi/*
            src-tauri/target/release/bundle/nsis/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows to Digital Ocean Spaces
        if: runner.os == 'Windows'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          for file in src-tauri/target/release/bundle/msi/*.msi src-tauri/target/release/bundle/nsis/*.exe; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              aws s3 cp "$file" "s3://debugger-app/releases/v${VERSION}/${filename}" \
                --endpoint-url https://sfo3.digitaloceanspaces.com \
                --region us-east-1 \
                --acl public-read
            fi
          done

      - name: Upload build artifacts for signing
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: src-tauri/target/release/bundle/

      - name: Test upload to Digital Ocean Spaces
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Testing upload with VERSION: ${VERSION}"

          # Find the first artifact file to test upload
          ARTIFACT=$(find src-tauri/target/release/bundle -type f \( -name "*.dmg" -o -name "*.AppImage*" -o -name "*.msi" -o -name "*.exe" \) | head -1)

          if [ -z "$ARTIFACT" ]; then
            echo "No artifacts found to upload"
            exit 1
          fi

          echo "Testing upload of: $ARTIFACT"
          FILENAME=$(basename "$ARTIFACT")

          curl -v -X PUT \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$ARTIFACT" \
            "https://debugger-app.sfo3.digitaloceanspaces.com/test/${FILENAME}"

          echo "Test upload completed"
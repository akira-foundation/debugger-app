name: Test Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-build:
    name: Test Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Node dependencies
        run: npm ci

      - name: Check Rust compilation
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Lint frontend
        run: npm run lint --if-present

      - name: Test build
        run: npm run tauri build

      - name: Test upload to Digital Ocean Spaces
        run: |
          # Find the first artifact file to test upload
          ARTIFACT=$(find src-tauri/target/release/bundle -type f \( -name "*.dmg" -o -name "*.AppImage*" -o -name "*.msi" -o -name "*.exe" \) | head -1)

          if [ -z "$ARTIFACT" ]; then
            echo "No artifacts found to upload"
            exit 0
          fi

          echo "Testing upload of: $ARTIFACT"
          FILENAME=$(basename "$ARTIFACT")
          TIMESTAMP=$(date +%s)

          curl -v -X PUT \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$ARTIFACT" \
            "https://debugger-app.sfo3.digitaloceanspaces.com/test/${TIMESTAMP}-${FILENAME}"

          echo "Test upload completed"

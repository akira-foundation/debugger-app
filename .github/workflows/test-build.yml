name: Test Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-build:
    name: Test Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            build_args: "--target x86_64-apple-darwin,aarch64-apple-darwin"
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build_args: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            build_args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }},aarch64-apple-darwin

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Node dependencies
        run: npm ci

      - name: Check Rust compilation
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Lint frontend
        run: npm run lint --if-present

      - name: Test build
        run: npm run tauri build ${{ matrix.build_args }}

      - name: Test upload to Digital Ocean Spaces
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET }}
        run: |
          # Get version from package.json
          VERSION=$(node -p "require('./package.json').version")
          echo "Testing upload for version: ${VERSION}"

          # Find the first artifact file to test upload
          ARTIFACT=$(find src-tauri/target/release/bundle -type f \( -name "*.dmg" -o -name "*.AppImage*" -o -name "*.msi" -o -name "*.exe" \) | head -1)

          if [ -z "$ARTIFACT" ]; then
            echo "No artifacts found to upload"
            exit 0
          fi

          echo "Testing upload of: $ARTIFACT"
          FILENAME=$(basename "$ARTIFACT")
          OBJECT_KEY="test/v${VERSION}/${FILENAME}"

          echo "Uploading to: s3://debugger-app/${OBJECT_KEY}"

          aws s3 cp "$ARTIFACT" "s3://debugger-app/${OBJECT_KEY}" \
            --endpoint-url https://sfo3.digitaloceanspaces.com \
            --region us-east-1 \
            --acl public-read

          echo "Test upload completed"

      - name: Create and upload latest.json for test
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_SECRET }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          RELEASE_URL="https://debugger-app.sfo3.cdn.digitaloceanspaces.com/test/v${VERSION}"

          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "Test Build ${VERSION}",
            "pub_date": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "platforms": {
              "darwin-aarch64": {
                "signature": "",
                "url": "${RELEASE_URL}/Akira%20Debugger_${VERSION}_universal.dmg"
              },
              "darwin-x86_64": {
                "signature": "",
                "url": "${RELEASE_URL}/Akira%20Debugger_${VERSION}_universal.dmg"
              },
              "linux-x86_64": {
                "signature": "",
                "url": "${RELEASE_URL}/akira-debugger_${VERSION}_amd64.AppImage.tar.gz"
              },
              "windows-x86_64": {
                "signature": "",
                "url": "${RELEASE_URL}/Akira.Debugger_${VERSION}_x64_en-US.msi.zip"
              }
            }
          }
          EOF

          echo "Created latest.json:"
          cat latest.json

          echo "Uploading latest.json to test folder"
          aws s3 cp latest.json "s3://debugger-app/test/v${VERSION}/latest.json" \
            --endpoint-url https://sfo3.digitaloceanspaces.com \
            --region us-east-1 \
            --acl public-read \
            --content-type application/json

          echo "Test latest.json upload completed"

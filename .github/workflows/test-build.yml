name: Test Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-build:
    name: Test Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Node dependencies
        run: npm ci

      - name: Create Windows ICO icon
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/icons | Out-Null
          python << 'EOF'
import struct
with open('public/logo.png', 'rb') as f:
    png_data = f.read()
ico_header = struct.pack('<HHH', 0, 1, 1)
image_dir = struct.pack('<BBBBHHII', 0, 0, 0, 0, 1, 32, len(png_data), 22)
with open('src-tauri/icons/icon.ico', 'wb') as f:
    f.write(ico_header)
    f.write(image_dir)
    f.write(png_data)
EOF

      - name: Create Windows ICO icon (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p src-tauri/icons
          python3 << 'EOF'
import struct
with open('public/logo.png', 'rb') as f:
    png_data = f.read()
ico_header = struct.pack('<HHH', 0, 1, 1)
image_dir = struct.pack('<BBBBHHII', 0, 0, 0, 0, 1, 32, len(png_data), 22)
with open('src-tauri/icons/icon.ico', 'wb') as f:
    f.write(ico_header)
    f.write(image_dir)
    f.write(png_data)
EOF

      - name: Check Rust compilation
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Lint frontend
        run: npm run lint --if-present

      - name: Test build
        run: npm run tauri build

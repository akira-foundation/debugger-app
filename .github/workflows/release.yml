name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: akira-debugger
            asset_name: Akira_Debugger_x86_64_linux
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: Akira Debugger.app
            asset_name: Akira_Debugger_aarch64_macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: Akira Debugger.exe
            asset_name: Akira_Debugger_x86_64_windows

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Node dependencies
        run: npm ci

      - name: Create Windows ICO icon
        if: runner.os == 'Windows'
        run: |
          mkdir -p src-tauri/icons
          python -c "
import struct
with open('public/logo.png', 'rb') as f:
    png_data = f.read()
ico_header = struct.pack('<HHH', 0, 1, 1)
image_dir = struct.pack('<BBBBHHII', 0, 0, 0, 0, 1, 32, len(png_data), 22)
with open('src-tauri/icons/icon.ico', 'wb') as f:
    f.write(ico_header)
    f.write(image_dir)
    f.write(png_data)
"

      - name: Build application
        run: npm run tauri build

      - name: Upload artifacts to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/target/release/bundle/dmg/*
            src-tauri/target/release/bundle/appimage/*
            src-tauri/target/release/bundle/msi/*
            src-tauri/target/release/bundle/nsis/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

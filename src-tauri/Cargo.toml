[package]
name = "akira-debugger"
version = "0.1.0"
description = "Akira Debugger — real-time desktop app for Laravel Ray logs."
authors = ["Kidiatoliny Gonçalves <kid@akira.io>"]
license = "MIT"
repository = "https://github.com/akira-io/akira-debugger"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.4", features = [] }
tokio = { version = "1.40", features = ["full"] }
serde_json = "1.0"
chrono = "0.4"
colored = "3.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
